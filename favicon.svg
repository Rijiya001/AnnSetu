<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b10"/>
      <stop offset="50%" stop-color="#0f3d24"/>
      <stop offset="100%" stop-color="#1b5e38"/>
    </linearGradient>

    <!-- Neon Multi-Color Border Ring -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Sun Halo -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Bridge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Leaf Lime Gradient -->
    <linearGradient id="leafLime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>

    <!-- Golden Grain Kernel -->
    <linearGradient id="goldKernel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Badge Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="url(#neonBorder)" stroke-width="2.8"/>

  <!-- Radiant Central Glow -->
  <circle cx="32" cy="27" r="19" fill="url(#sunGlow)"/>

  <!-- Bridge Arch (Setu) -->
  <path d="M 6 48 Q 32 33 58 48" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Bridge Roadway -->
  <path d="M 6 51.5 L 58 51.5" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Suspension Cables -->
  <line x1="17" y1="43" x2="17" y2="51.5" stroke="#fbbf24" stroke-width="1.4" opacity="0.85"/>
  <line x1="24" y1="39" x2="24" y2="51.5" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
  <line x1="32" y1="36.5" x2="32" y2="51.5" stroke="#fef08a" stroke-width="1.8"/>
  <line x1="40" y1="39" x2="40" y2="51.5" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
  <line x1="47" y1="43" x2="47" y2="51.5" stroke="#fbbf24" stroke-width="1.4" opacity="0.85"/>

  <!-- Sprout & Crop Motif (Ann) -->
  <path d="M 32 37 C 19 34 13 22 19 12 C 27 15 31 26 32 37 Z" fill="url(#leafGreen)"/>
  <path d="M 32 37 C 45 34 51 22 45 12 C 37 15 33 26 32 37 Z" fill="url(#leafLime)"/>

  <!-- Golden Grain in Center -->
  <ellipse cx="32" cy="24.5" rx="4.5" ry="7.5" fill="url(#goldKernel)"/>
  <!-- Sprout Vein -->
  <path d="M 32 37 L 32 17" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- Sparkles -->
  <!-- Top Right Big Diamond Star -->
  <path d="M 48 7 Q 48 13 54 13 Q 48 13 48 19 Q 48 13 42 13 Q 48 13 48 7 Z" fill="#ffffff"/>
  <circle cx="48" cy="13" r="1.5" fill="#fef08a"/>
  <!-- Mini Sparkles -->
  <circle cx="12" cy="20" r="1.8" fill="#34d399"/>
  <circle cx="18" cy="10" r="1.5" fill="#fbbf24"/>
</svg>

